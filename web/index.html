<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Papertown</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4eee2" />
    <script>
      // applyLook() from settings.ts, run before first paint; both must decide the look the same way
      (function () {
        var s = {}, h = document.documentElement;
        try { s = JSON.parse(localStorage.getItem('pt-settings')) || {}; } catch (e) { /* private mode */ }
        if (s.ui === 'paper') return;
        h.classList.add('ui-cf');
        if (s.mode === 'dark' || (s.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) h.dataset.mode = 'dark';
        if ((s.ui || (/\bPapertown\//.test(navigator.userAgent) ? 'macos' : '')) !== 'macos') return;
        h.classList.add('ui-mac');
        h.dataset.accent = s.accent || 'blue';
        h.dataset.wall = s.wallTint === false ? 'none' : s.wall || 'dawn';
        if (s.glass != null) h.style.setProperty('--g', s.glass);
      })();
    </script>
    <style>
      /* boot mark, replaced when the app renders */
      body.proto-page { margin: 0; background: #f4eee2; }
      .boot {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px;
        color: #2f261d; font: 30px "LXGW WenKai Screen", "Songti SC", "STSong", serif; letter-spacing: .04em;
        animation: boot-in .7s cubic-bezier(.16, 1, .3, 1) .15s both;
      }
      .boot img { width: 96px; height: 96px; animation: boot-bob 2.6s cubic-bezier(.65, 0, .35, 1) infinite; }
      .boot i { width: 56px; height: 3px; margin-top: 4px; border-radius: 3px; background: linear-gradient(90deg, transparent, #c2663f, transparent) 0 0 / 200% 100%; animation: boot-run 1.3s linear infinite; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(8px); } }
      @keyframes boot-bob { 50% { transform: translateY(-4px) rotate(-3deg); } }
      @keyframes boot-run { from { background-position: 100% 0; } to { background-position: -100% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot img, .boot i { animation: none; } }
      html.ui-cf body.proto-page { background: #fafafa; }
      html.ui-cf .boot { color: #1a1a1a; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      html.ui-cf .boot img { width: 64px; height: 64px; }
      html.ui-cf .boot i { background-image: linear-gradient(90deg, transparent, #2563eb, transparent); }
      html.ui-cf[data-mode=dark] body.proto-page { background: #111; }
      html.ui-cf[data-mode=dark] .boot { color: #f5f5f5; }
      html.ui-mac body.proto-page { background: #eef0f6; }
      html.ui-mac[data-mode=dark] body.proto-page { background: #15161b; }
    </style>
  </head>
  <body class="proto-page">
    <div id="root"><div class="boot"><img src="/logo.svg" alt="" />Papertown<i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
