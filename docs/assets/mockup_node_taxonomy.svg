<rect width="1440" height="720" fill="#f8fafc"/>
<text x="40" y="44" font-size="20" class="heavy">「研究回路」节点与连线视觉语法规范（Hard vs Soft Visual Grammar）</text>
<text x="40" y="68" font-size="13" class="muted">造型即语义：用切角机械结构表达确定性代码限制（Hard），用流体双环与虚线结构表达概率模型引导与审视（Soft）</text>
<rect x="40" y="92" width="432" height="396" rx="14" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh-sm)"/>
<rect x="40" y="92" width="432" height="40" rx="14" fill="#fff1f2"/><text x="60" y="117" font-size="14" class="heavy" fill="#be123c">1. 硬机制家族（Hard · 确定性代码与物理拦截）</text>
<text x="60" y="156" font-size="12" class="bold ink2">A. 硬卡口节点（Hard Gate · 串联门禁）— 切角八边形 + 刻度 + 锁扣</text>

    <g filter="url(#sh-sm)">
      
      <polygon points="70,168 240,168 250,178 250,230 240,240 70,240 60,230 60,178" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
      <polygon points="71,171 239,171 247,179 247,229 239,237 71,237 63,229 63,179" fill="none" stroke="#0d9488" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="68" y="176" width="174" height="20" rx="4" fill="#f0fdfa"/>
      <rect x="68" y="176" width="6" height="20" rx="2" fill="url(#hazard-ok)"/>
      <polygon points="82,182 86,186 82,190 78,186" fill="#0d9488"/>
      <text x="91" y="190" font-size="10.5" class="mono heavy" fill="#0f766e">HARD · 1.1 P0</text>
      <rect x="200" y="178" width="40" height="16" rx="4" fill="#ccfbf1"/>
      <text x="220" y="189.5" font-size="10" text-anchor="middle" class="bold" fill="#0f766e">放行</text>
      <text x="74" y="214" font-size="12.5" class="bold">禁用词检测</text>
      <text x="238" y="214" font-size="11.5" text-anchor="end" class="mono heavy" fill="#0d9488">0 / ≤0</text>
      <text x="74" y="229" font-size="10.5" class="mono muted">R1:8 → R2:0 · 清零</text>
    </g>
    

    <g filter="url(#sh-sm)">
      
      <polygon points="274,168 444,168 454,178 454,230 444,240 274,240 264,230 264,178" fill="#fffafb" stroke="#e11d48" stroke-width="2"/>
      <polygon points="275,171 443,171 451,179 451,229 443,237 275,237 267,229 267,179" fill="none" stroke="#e11d48" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="272" y="176" width="174" height="20" rx="4" fill="#ffe4e6"/>
      <rect x="272" y="176" width="6" height="20" rx="2" fill="url(#hazard-red)"/>
      <polygon points="286,182 290,186 286,190 282,186" fill="#e11d48"/>
      <text x="295" y="190" font-size="10.5" class="mono heavy" fill="#be123c">HARD · 3.2 P0</text>
      <rect x="404" y="178" width="40" height="16" rx="4" fill="#fecdd3"/>
      <text x="424" y="189.5" font-size="10" text-anchor="middle" class="bold" fill="#be123c">阻断</text>
      <text x="278" y="214" font-size="12.5" class="bold">图表长标题</text>
      <text x="442" y="214" font-size="11.5" text-anchor="end" class="mono heavy" fill="#e11d48">1 / ≤0</text>
      <text x="278" y="229" font-size="10.5" class="mono muted">main.tex:184 违规</text>
    </g>
    
<text x="60" y="272" font-size="12" class="bold ink2">B. 硬卡口聚合组（Gate Cluster · 可一键展开子项）</text>

    <g filter="url(#sh-sm)">
      
      <polygon points="70,284 444,284 454,294 454,350 444,360 70,360 60,350 60,294" fill="#fffafb" stroke="#e11d48" stroke-width="2"/>
      <polygon points="71,287 443,287 451,295 451,349 443,357 71,357 63,349 63,295" fill="none" stroke="#e11d48" stroke-opacity="0.22" stroke-width="1"/>
