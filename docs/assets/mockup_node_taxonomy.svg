      <polygon points="82,298 86,302 82,306 78,302" fill="#e11d48"/>
      <text x="91" y="306" font-size="10.5" class="mono heavy" fill="#be123c">HARD · P0/P1</text>
      <rect x="404" y="294" width="40" height="16" rx="4" fill="#fecdd3"/>
      <text x="424" y="305.5" font-size="10" text-anchor="middle" class="bold" fill="#be123c">阻断</text>
      <text x="74" y="330" font-size="12.5" class="bold">lastcheck 写作硬卡口组 (6 项规则)</text>
      <text x="442" y="330" font-size="11.5" text-anchor="end" class="mono heavy" fill="#e11d48">4/6 放行</text>
      <rect x="74" y="338" width="10" height="10" rx="2" fill="#10b981"/><rect x="88" y="338" width="10" height="10" rx="2" fill="#10b981"/><rect x="102" y="338" width="10" height="10" rx="2" fill="#10b981"/><rect x="116" y="338" width="10" height="10" rx="2" fill="#10b981"/><rect x="130" y="338" width="10" height="10" rx="2" fill="#f59e0b"/><rect x="144" y="338" width="10" height="10" rx="2" fill="#e11d48"/><text x="164" y="347" font-size="10.5" class="mono ink2">R1:19处 → R3:3处 (点开逐条定位)</text>
    </g>
    
<text x="60" y="392" font-size="12" class="bold ink2">C. 硬边界夹（Hard Clamp · 前置代码动作锁）</text>

    <g>
      <rect x="60" y="404" width="394" height="62" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2.2"/>
      <rect x="60" y="404" width="394" height="20" rx="4" fill="#1e293b"/>
      <text x="72" y="418" font-size="10" class="mono bold white">■ HARD CLAMP · bounds.never / 系统动作级锁死</text>
      <text x="72" y="440" font-size="12" class="bold">禁止取消 nvidb 队列任务 · 禁止修改本地仓库外路径</text>
      <text x="72" y="457" font-size="10.5" class="muted">不依赖大模型自觉，Papertown 服务端直接物理拒绝或挂起审批</text>
    </g>
    
<rect x="504" y="92" width="432" height="396" rx="14" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh-sm)"/>
<rect x="504" y="92" width="432" height="40" rx="14" fill="#f5f3ff"/><text x="524" y="117" font-size="14" class="heavy" fill="#6d28d9">2. 软机制家族（Soft · 概率引导与语义审视）</text>
<text x="524" y="156" font-size="12" class="bold ink2">A. 软巡检节点（Soft Sentinel · 持续校准）— 双环透镜胶囊 + 判词</text>

    <g filter="url(#sh-sm)">
      <rect x="521" y="165" width="398" height="80" rx="27" fill="none" stroke="#d97706" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="5,4"/>
