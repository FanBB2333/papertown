    </g>
    
<text x="988" y="384" font-size="12" class="bold ink2">C. 人类拍板节点（Human Decision Beacon）</text>

    <g>
      <polygon points="1004,398 1364,398 1380,432 1364,466 1004,466 988,432" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
      <text x="1014" y="421" font-size="10.5" class="mono bold" fill="#b45309">👤 HUMAN IN THE LOOP · 关键立项 / 偏航仲裁 / 终审</text>
      <text x="1014" y="441" font-size="12.5" class="bold">软巡检严重偏离或硬卡口超轮次时唤醒你拍板</text>
      <text x="1014" y="458" font-size="10.5" class="muted">支持一键批准、退回重做或调整研究假设</text>
    </g>
    
<rect x="40" y="512" width="1360" height="176" rx="14" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh-sm)"/>
<text x="60" y="542" font-size="14" class="heavy">4. 四种回路控制连线语义（Edges as Control Flow，彻底取代无方向灰线）</text>
<rect x="60" y="558" width="316" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="74" y="580" font-size="12" class="bold">① 主推进与门禁阻断线</text>
<line x1="80" y1="606" x2="346" y2="606" stroke="#0d9488" stroke-width="2.8"  marker-end="url(#arr-ok)"/>
<text x="74" y="636" font-size="11" class="ink2">上游硬卡口全过 → 实线亮起放行；卡口未过 → </text>
<text x="74" y="654" font-size="11" class="muted">下游变为带「锁死」徽标的灰虚线</text>
<rect x="396" y="558" width="316" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="410" y="580" font-size="12" class="bold">② 硬打回内循环弧 (Hard Loop)</text>
<line x1="416" y1="606" x2="682" y2="606" stroke="#e11d48" stroke-width="2.8" stroke-dasharray="7,4" marker-end="url(#arr-bad)"/>
<text x="410" y="636" font-size="11" class="ink2">P0 硬卡口未过 → 动态绯红短划弧打回给员工，</text>
<text x="410" y="654" font-size="11" class="muted">跑 pt checks run 直到 0 违规</text>
<rect x="732" y="558" width="316" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="746" y="580" font-size="12" class="bold">③ 软纠偏反馈弧 (Soft Steering)</text>
<line x1="752" y1="606" x2="1018" y2="606" stroke="#d97706" stroke-width="2.8" stroke-dasharray="3,4" marker-end="url(#arr-warn)"/>
<text x="746" y="636" font-size="11" class="ink2">软巡检发现偏航/缺消融 → 琥珀点划弧跨阶段回连</text>
<text x="746" y="654" font-size="11" class="muted">实验/方法，派发纠偏单</text>
<rect x="1068" y="558" width="316" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
