      .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .muted { fill: #64748b; }
      .ink2 { fill: #334155; }
      .white { fill: #ffffff; }
      .ok { fill: #0d9488; }
      .ok-ink { fill: #0f766e; }
      .bad { fill: #e11d48; }
      .warn { fill: #d97706; }
