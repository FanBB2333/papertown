      <rect x="866" y="177.5" width="38" height="16" rx="8" fill="#fde68a"/>
      <text x="885" y="188.5" font-size="10" text-anchor="middle" class="bold" fill="#b45309">预警</text>
      <text x="540" y="211" font-size="12.5" class="bold">实验方向与消融完备性</text>
      <text x="540" y="228" font-size="10.8" class="ink2">“主表公平，但缺步长 &gt;50 消融；建议补跑并更新 §4.3”</text>
      <circle cx="878" cy="229" r="3.6" fill="#10b981"/><circle cx="889" cy="229" r="3.6" fill="#10b981"/><circle cx="900" cy="229" r="3.6" fill="#f59e0b"/>
    </g>
    

    <g filter="url(#sh-sm)">
      <rect x="521" y="257" width="398" height="80" rx="27" fill="none" stroke="#0d9488" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="5,4"/>
      <rect x="524" y="260" width="392" height="74" rx="24" fill="#f8fafc" stroke="#0d9488" stroke-width="1.6"/>
