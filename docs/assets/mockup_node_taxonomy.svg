      <text x="885" y="280.5" font-size="10" text-anchor="middle" class="bold" fill="#0f766e">契合</text>
      <text x="540" y="303" font-size="12.5" class="bold">主张有据 (Claim-Evidence)</text>
      <text x="540" y="320" font-size="10.8" class="ink2">“引言 3 条核心贡献均与表 1、表 2 及图 4 一一对应”</text>
      <circle cx="878" cy="321" r="3.6" fill="#f59e0b"/><circle cx="889" cy="321" r="3.6" fill="#10b981"/><circle cx="900" cy="321" r="3.6" fill="#10b981"/>
    </g>
    
<text x="524" y="366" font-size="12" class="bold ink2">B. 软限制规范卡（Soft Prompt Spec · 前置提示词引导）</text>

    <g>
      <rect x="524" y="380" width="392" height="86" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5,3"/>
      <text x="538" y="400" font-size="10.5" class="mono bold" fill="#6d28d9">◌ SOFT SPEC · Prompt / AGENTS.md / bounds.must</text>
      <text x="538" y="421" font-size="12.5" class="bold">研究核心假设与写作风格要求（注入 Agent 上下文）</text>
      <text x="538" y="441" font-size="11" class="ink2">因为模型是概率生成模型，软限制负责“引导方向”，</text>
      <text x="538" y="457" font-size="11" class="muted">其执行偏差必须交由下游「硬卡口 + 软巡检」闭环兜底。</text>
    </g>
    
<rect x="968" y="92" width="432" height="396" rx="14" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh-sm)"/>
<rect x="968" y="92" width="432" height="40" rx="14" fill="#eff6ff"/><text x="988" y="117" font-size="14" class="heavy" fill="#1d4ed8">3. 工序、返工执行单与人类决策节点</text>
<text x="988" y="156" font-size="12" class="bold ink2">A. 工序工位站（Stage Station · 内嵌驻场员工与实时进度）</text>

