<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papertown 原型</title>
<style>
/* ---------- gallery shell ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #f3f3f1; color: #1d1d1f;
  font: 14px/1.6 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  padding-bottom: 90px;
}
code { font: 12px ui-monospace, Menlo, monospace; background: #e9e9e5; padding: 1px 5px; border-radius: 4px; }
.g-wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 24px; }
.g-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.g-title h1 { margin: 0; font-size: 28px; letter-spacing: .01em; }
.g-title span { color: #77777d; font-size: 13px; }
.g-lead { max-width: 820px; color: #3b3b40; margin: 10px 0 0; }
.g-sec { margin-top: 34px; }
.g-sec h2 { font-size: 18px; margin: 0 0 12px; }
.g-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.g-row h2 { margin: 0; }
.g-note { color: #5f5f66; font-size: 13px; margin: 6px 0 12px; }

.g-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.g-card {
  position: relative; background: #fff; border: 1px solid #e3e3e0; border-radius: 14px; padding: 10px;
  cursor: pointer; transition: border-color .15s, box-shadow .15s; outline: none;
}
.g-card:hover { border-color: #b9b9b4; }
.g-card.on { border-color: #1d1d1f; box-shadow: 0 0 0 2px #1d1d1f; }
.g-card:focus-visible { box-shadow: 0 0 0 3px #7aa7ff; }
.g-card h3 { margin: 10px 2px 2px; font-size: 15px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.g-card h3 small { color: #8a8a90; font-weight: 400; font-size: 12px; }
.g-card p { margin: 0 2px; color: #5f5f66; font-size: 12.5px; line-height: 1.5; }
.g-card .picked { position: absolute; z-index: 3; top: 16px; right: 16px; background: #1d1d1f; color: #fff; font-size: 11px; padding: 2px 9px; border-radius: 99px; }
.tag { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: #fff1d6; color: #9a5b00; font-weight: 500; }
.g-thumb { border-radius: 9px; overflow: hidden; border: 1px solid #ececea; pointer-events: none; }
.g-fit { position: relative; overflow: hidden; width: 100%; }
.g-fit > .g-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; }
.still *, .still *::before, .still *::after { animation: none !important; transition: none !important; }

.g-tsample { height: 120px; border-radius: 9px; display: flex; align-items: center; justify-content: center; gap: 2px; padding: 8px; overflow: hidden; }
.g-tsample .sp-svg { height: 92px; width: auto; flex: 0 1 auto; min-width: 0; }
.g-sw { display: flex; gap: 4px; margin-top: 8px; }
.g-sw i { flex: 1; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.08); }

.g-frame { position: relative; background: #fff; border: 1px solid #deded9; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.08); }
.g-chrome { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #f6f6f4; border-bottom: 1px solid #e6e6e2; }
.g-chrome i { width: 11px; height: 11px; border-radius: 50%; background: #dedeD9; }
.g-chrome span { margin-left: 12px; font-size: 12px; color: #8a8a90; background: #fff; border: 1px solid #e6e6e2; border-radius: 6px; padding: 1px 12px; }
.g-tip { position: absolute; z-index: 5; width: 260px; background: rgba(22,22,26,.94); color: #fff; padding: 9px 11px; border-radius: 9px; font-size: 12px; line-height: 1.5; pointer-events: none; }
.g-tip b { font-size: 13.5px; margin-right: 6px; }
.g-tip span { color: #b7b7c0; }
.g-tip p { margin: 4px 0; }
.g-tip em { font-style: normal; color: #ffd27a; }

.g-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.g-box { background: #fff; border: 1px solid #e3e3e0; border-radius: 14px; padding: 16px 18px; }
.g-box h3 { margin: 0 0 6px; font-size: 16px; }
.g-box h3 small { color: #8a8a90; font-weight: 400; font-size: 12px; }
.g-box p { margin: 4px 0; color: #3b3b40; }
.g-fitfor { font-size: 13px; }
.g-pc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0 12px; }
.g-pc ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: #3b3b40; }
.g-pc li { padding-left: 18px; position: relative; margin: 3px 0; }
.g-pc .pros li::before { content: '+'; position: absolute; left: 2px; color: #2f8f5b; font-weight: 700; }
.g-pc .cons li::before { content: '−'; position: absolute; left: 2px; color: #c4553f; font-weight: 700; }
.g-btn { font: inherit; font-size: 13px; border: 1px solid #1d1d1f; background: #1d1d1f; color: #fff; border-radius: 9px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.g-btn.ghost { background: #fff; color: #1d1d1f; }
.g-link { display: inline-block; margin-left: 12px; font-size: 12.5px; color: #3b6fd8; text-decoration: none; }
body.solo { padding: 0; background: #111; }
.g-solo { width: 1280px; height: 800px; overflow: hidden; }

.g-compare { display: grid; gap: 12px; }
.g-table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid #e3e3e0; border-radius: 14px; overflow: hidden; font-size: 13px; }
.g-table th, .g-table td { padding: 9px 12px; border-bottom: 1px solid #efefeb; text-align: left; vertical-align: middle; }
.g-table tr:last-child td { border-bottom: 0; }
.g-table th { background: #f7f7f5; font-weight: 600; color: #3b3b40; }
.stars { color: #d39a2c; letter-spacing: 1px; white-space: nowrap; }
.stars s { color: #e4e1d8; text-decoration: none; }

.g-tabs { display: flex; gap: 4px; background: #e9e9e5; padding: 3px; border-radius: 10px; }
.g-tabs button { font: inherit; font-size: 13px; border: 0; background: transparent; padding: 4px 12px; border-radius: 8px; cursor: pointer; color: #5f5f66; }
.g-tabs button.on { background: #fff; color: #1d1d1f; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.g-assets { background: var(--bg); color: var(--ink); border-radius: 14px; padding: 16px; border: 1px solid #e3e3e0; font-family: var(--font); }
.a-h { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 6px 0 10px; font-family: var(--head); }
.a-h i { width: 10px; height: 10px; border-radius: 3px; }
.a-h small { font-weight: 400; color: var(--muted); font-size: 12px; font-family: var(--font); }
.g-agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.acard { background: var(--panel); border: var(--pborder); border-radius: var(--radius); padding: 10px 12px; }
.acard .art { height: 128px; display: flex; align-items: center; justify-content: center; }
.acard .art svg { max-width: 100%; max-height: 124px; }
.acard .art .ic { width: 72px; height: 72px; }
.acard b { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.acard code { display: inline-block; margin-top: 2px; font-size: 11px; background: transparent; padding: 0; color: var(--muted); }
.acard .dist { display: block; font-size: 11.5px; color: var(--brand); }
.acard p { font-size: 12px; color: var(--muted); margin: 4px 0 0; line-height: 1.45; }
.acard small { display: block; font: 10.5px ui-monospace, Menlo, monospace; color: var(--muted); opacity: .75; margin-top: 6px; word-break: break-all; }
.later { font-size: 10.5px; font-weight: 500; padding: 0 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }

.g-bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-top: 1px solid #e3e3e0; z-index: 20; }
.g-bar-in { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: relative; }
.g-pick { display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px; border-radius: 99px; background: #efefeb; font-size: 13px; }
.g-pick.empty { color: #9a9aa0; }
.g-pick em { font-style: normal; }
.g-bar input { flex: 1; min-width: 200px; font: inherit; font-size: 13px; padding: 7px 11px; border: 1px solid #deded9; border-radius: 9px; }
.g-toast { position: absolute; right: 24px; top: -38px; background: #1d1d1f; color: #fff; font-size: 12px; padding: 5px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.g-toast.show { opacity: 1; }

.g-full { position: fixed; inset: 0; background: rgba(12,12,14,.88); z-index: 50; display: flex; align-items: center; justify-content: center; }
.g-full[hidden] { display: none; }
.g-fs { width: 1280px; height: 800px; flex: none; transform-origin: center; border-radius: 10px; overflow: hidden; }
.g-close { position: absolute; top: 14px; right: 18px; z-index: 2; font: inherit; font-size: 13px; background: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }

@media (max-width: 900px) {
  .g-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-detail, .g-pc { grid-template-columns: 1fr; }
}

/* ---------- sprites & map ---------- */
.sp text { font-family: "PingFang SC", "Hiragino Sans GB", Helvetica, sans-serif; font-weight: 700; }
.sp .ln, .sp .ln2 { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sp .ln2 { stroke-width: 3; }
.sp .shadow { fill: rgba(0,0,0,.14); stroke: none; }
.sp .hl, .sp .beam, .sp .smoke { stroke: none; }
.sp .t-inv { fill: #fff; }
.sp-svg { display: block; overflow: visible; }
.map { display: block; width: 100%; height: 100%; }
.map .roaddash { stroke-dasharray: 9 11; opacity: .75; stroke-width: 1.3; }
.map .wave { opacity: .6; }
.map .core-pad { fill: color-mix(in srgb, var(--accent) 13%, transparent); stroke: color-mix(in srgb, var(--accent) 55%, transparent); stroke-width: 1.4; stroke-dasharray: 7 6; }
.theme-paper .map .tile { stroke: rgba(90,60,30,.07); stroke-width: .6; }
.theme-blueprint .map .tile { stroke: rgba(190,225,255,.12); stroke-width: .6; }
.theme-paper .bld { filter: drop-shadow(2px 3px 0 rgba(90,60,30,.16)); }
.g-stage .bld, .g-fs .bld { cursor: pointer; }
.g-stage .bld:hover, .g-fs .bld:hover { filter: brightness(1.08); }

.flowpath { fill: none; stroke: var(--brand); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; opacity: .45; }
.fdot { stroke: rgba(0,0,0,.35); stroke-width: 1.2; }
.fd-paper { fill: #fffaf0; } .fd-egg { fill: #f2cf63; } .fd-code { fill: #d98a3d; } .fd-energy { fill: #ffd84a; } .fd-data { fill: #6fb6e0; }
.fkey { width: 10px; height: 10px; border-radius: 50% !important; border: 1px solid rgba(0,0,0,.3); }
.fkey.fd-paper { background: #fffaf0; } .fkey.fd-egg { background: #f2cf63; } .fkey.fd-code { background: #d98a3d; } .fkey.fd-energy { background: #ffd84a; } .fkey.fd-data { background: #6fb6e0; }

.dlbl rect { fill: var(--panel); stroke: var(--line); opacity: .93; }
.dlbl text { fill: var(--ink); font-family: var(--head); font-weight: 700; letter-spacing: .08em; }
.blbl rect { fill: var(--panel); stroke: var(--line); }
.blbl text { fill: var(--ink); font-family: var(--font); font-weight: 600; }
.blbl.hl rect { fill: var(--brand); stroke: none; }
.blbl.hl text { fill: var(--brand-ink); }
.focus { fill: color-mix(in srgb, var(--brand) 16%, transparent); stroke: var(--brand); stroke-width: 2.5; stroke-dasharray: 10 8; }

.anim .focus { animation: dash 1.6s cubic-bezier(.45, 0, .25, 1) infinite; }
@keyframes dash { to { stroke-dashoffset: -36; } }
.anim .smoke { transform-box: fill-box; transform-origin: center; animation: puff 3.6s ease-out infinite; }
.anim .smoke.s2 { animation-delay: -1.2s; }
.anim .smoke.s3 { animation-delay: -2.4s; }
@keyframes puff { 0% { transform: translateY(8px) scale(.6); opacity: 0; } 25% { opacity: .95; } 100% { transform: translateY(-14px) scale(1.25); opacity: 0; } }
.anim .bob { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2.5px); } }

.theme-paper .map-bg { background: radial-gradient(ellipse at 50% 42%, #f4e9d4 0%, #e7d6b6 68%, #dcc7a1 100%); }
.theme-day .map-bg { background: linear-gradient(180deg, #dff2fa, #bfe2f1); }
.theme-blueprint .map-bg {
  background-color: #0e3560;
  background-image: linear-gradient(rgba(190,225,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(190,225,255,.08) 1px, transparent 1px);
  background-size: 24px 24px;
}
.theme-night .map-bg { background: radial-gradient(ellipse at 50% 35%, #1a2440 0%, #0b0f18 72%); }
.theme-night .flowpath { opacity: .7; }
.theme-night .glow .m-win, .theme-night .glow .lampbulb { filter: drop-shadow(0 0 2.5px #ffb347); }
.theme-night.glow .m-win, .theme-night.glow .lampbulb { filter: drop-shadow(0 0 2.5px #ffb347); }
.theme-night.glow .fdot { filter: drop-shadow(0 0 4px currentColor); }
.theme-night .fdot { stroke: rgba(255,255,255,.6); }
.theme-blueprint .fdot { stroke: #e4f1ff; }

/* ---------- shared UI inside a layout ---------- */
.ui { position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
.ui h1, .ui h2, .ui h3, .ui h4, .ui h5, .ui h6 { font-family: var(--head); text-transform: var(--hcase); margin: 0; }
.ui p { margin: 0; }
.ui button { font-family: inherit; }
.pnl { background: var(--panel); border: var(--pborder); border-radius: var(--radius); box-shadow: var(--pshadow); }
.btn { font-size: 13px; border: var(--pborder); background: var(--panel2); color: var(--ink); border-radius: calc(var(--radius) * .8); padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.pri { background: var(--brand); color: var(--brand-ink); border-color: transparent; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.chip.pri { color: var(--brand-ink); background: var(--brand); border-color: transparent; }
.bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 11%, transparent); overflow: hidden; flex: 1; min-width: 40px; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: inherit; }
.ava { display: inline-block; flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; vertical-align: middle; }
.ava svg { width: 100%; height: 100%; }
.me { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--head); font-size: 18px; white-space: nowrap; }
.logo-ic { width: 26px; height: 26px; flex: none; }
.lg1 { fill: var(--brand); } .lg2 { fill: color-mix(in srgb, var(--brand), black 22%); } .lg3 { fill: var(--panel); }
.ic { width: 24px; height: 24px; flex: none; }
.lb .demo-tag { right: 452px; }
.demo-tag { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: var(--muted); opacity: .85; z-index: 9; }
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: var(--panel); border-bottom: var(--pborder); }
.tabs { display: flex; gap: 2px; }
.tabs a { padding: 5px 12px; border-radius: calc(var(--radius) * .8); color: var(--muted); font-size: 14px; }
.tabs a.on { background: var(--panel2); color: var(--ink); font-weight: 600; }
.search { flex: 1; max-width: 320px; margin-left: auto; padding: 6px 12px; border: var(--pborder); border-radius: calc(var(--radius) * .8); color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

/* ---------- A · world-first ---------- */
.la .map-bg { position: absolute; inset: 0; }
.la .hud { position: absolute; top: 14px; left: 14px; right: 14px; height: 58px; display: flex; align-items: center; gap: 26px; padding: 0 16px; }
.la .hud-stats { display: flex; gap: 26px; }
.la .hud-stats div { display: flex; flex-direction: column; line-height: 1.25; }
.la .hud-stats i { font-style: normal; font-size: 11px; color: var(--muted); }
.la .hud-stats b { font-size: 15px; }
.la .hud-stats em { font-style: normal; font-size: 12px; font-weight: 400; color: var(--muted); }
.la .hud-r { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.bell { width: 30px; height: 30px; border-radius: 50%; border: var(--pborder); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--panel2); color: var(--bad); }
.la .legend { position: absolute; left: 14px; top: 86px; width: 168px; padding: 10px 14px; }
.la .legend h4 { font-size: 12px; color: var(--muted); margin: 4px 0 4px; font-family: var(--font); }
.lg-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 1px 0; }
.lg-row i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-row em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 11px; }
.la .bcard { position: absolute; right: 14px; top: 86px; width: 340px; padding: 14px; }
.bc-head { display: flex; gap: 10px; align-items: center; }
.bc-head .sp-svg { width: 104px; height: 80px; flex: none; }
.bc-head small { color: var(--muted); font-size: 11px; }
.bc-head h3 { font-size: 19px; }
.bc-head p { font-size: 12.5px; color: var(--muted); }
.stages { display: flex; gap: 3px; margin: 12px 0 10px; }
.st { flex: 1; text-align: center; font-size: 11px; padding: 3px 0; border-radius: 6px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.st.done { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); border-color: transparent; }
.st.run { background: var(--brand); color: var(--brand-ink); border-color: transparent; font-weight: 600; }
.bc-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.bc-team { display: flex; align-items: center; gap: 3px; margin: 10px 0 12px; font-size: 12px; color: var(--muted); }
.bc-team span { margin-left: 6px; }
.bc-btns { display: flex; gap: 8px; }
.la .newidea { position: absolute; left: 14px; bottom: 72px; padding: 9px 18px 9px 10px; font-size: 15px; border-radius: 99px; box-shadow: var(--pshadow); }
.la .newidea .ic { width: 26px; height: 26px; }
.la .ticker { position: absolute; left: 14px; right: 250px; bottom: 14px; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 13px; white-space: nowrap; }
.ticker b { background: var(--brand); color: var(--brand-ink); padding: 1px 8px; border-radius: 4px; font-size: 12px; flex: none; }
.ticker span { overflow: hidden; text-overflow: ellipsis; }
.la .minimap { position: absolute; right: 14px; bottom: 14px; width: 226px; height: 132px; padding: 4px; overflow: hidden; }
.mm-view { position: absolute; left: 30%; top: 26%; width: 40%; height: 44%; border: 2px solid var(--brand); border-radius: 3px; }

/* ---------- B · map + workbench ---------- */
.lb { display: flex; flex-direction: column; }
.lb main { flex: 1; display: flex; min-height: 0; }
.lb .map-area { flex: 1; position: relative; min-width: 0; }
.lb .map-area .map { position: absolute; inset: 0; }
.map-tools { position: absolute; left: 14px; top: 14px; display: flex; gap: 2px; padding: 4px; }
.map-tools button { font-size: 12px; border: 0; background: transparent; color: var(--muted); padding: 3px 9px; border-radius: 6px; }
.map-tools button.on { background: var(--panel2); color: var(--ink); font-weight: 600; }
.map-tools .sep { width: 1px; background: var(--line); margin: 3px 4px; }
.map-hint { position: absolute; left: 14px; bottom: 14px; padding: 5px 12px; font-size: 12px; color: var(--muted); }
.lb .bench { width: 440px; flex: none; border-left: var(--pborder); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.bench-tabs { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: var(--pborder); align-items: center; }

// ---------- CSS for the browser ----------

function specCSS(spec) {
  switch (spec[0]) {
    case 'acc': return 'var(--accent)';
    case 'mix': return `color-mix(in srgb,var(--accent) ${spec[1]}%,${spec[2]})`;
    case 'alpha': return `color-mix(in srgb,var(--accent) ${spec[1] * 100}%,transparent)`;
    default: return spec[1];
  }
}

export function themeCSS(t) {
  const s = `.theme-${t.key}`;
  const u = t.ui;
  let css = `${s}{--bg:${u.bg};--panel:${u.panel};--panel2:${u.panel2};--ink:${u.ink};--muted:${u.muted};--line:${u.line};` +
    `--brand:${u.brand};--brand-ink:${u.brandInk};--ok:${u.ok};--warn:${u.warn};--bad:${u.bad};--font:${u.font};--head:${u.head};` +
    `--radius:${u.radius};--pborder:${u.border};--pshadow:${u.shadow};--hcase:${u.headCase}}`;
  for (const [m, spec] of Object.entries(t.mats)) css += `${s} .m-${m}{--c:${specCSS(spec)}}`;
  css += `${s} .f-l{fill:var(--c)}${s} .f-t{fill:color-mix(in srgb,var(--c),white ${t.shade[0]}%)}` +
    `${s} .f-r{fill:color-mix(in srgb,var(--c),black ${t.shade[1]}%)}`;
  // hand-drawn sprites: the wash carries no stroke, the separate ink line does
  const shapes = `:is(polygon,path,ellipse,circle,rect):not(.ln):not(.ln2):not(.hl):not(.smoke):not(.beam):not(.shadow):not(.nost):not(.ink)${t.ink ? ':not(.wash)' : ''}`;
  css += t.stroke
    ? `${s} .sp ${shapes}{stroke:${specCSS(t.stroke)};stroke-width:${t.strokeW};stroke-linejoin:round}`
    : `${s} .sp ${shapes}{stroke:none}`;
  css += t.ink
    ? `${s} .sp .ink{fill:none;stroke:${t.ink};stroke-width:${t.inkW};stroke-linecap:round;stroke-linejoin:round}${s} .sp .ink-s{stroke-width:${t.inkW * 0.7};opacity:.7}${s} .sp .wash{stroke:none}`
    : `${s} .sp .ink{display:none}`;
  css += `${s} .sp .t-sign{fill:${t.text}}${s} .sp .smoke{fill:${t.smoke}}${s} .sp .hl{fill:${t.hl}}${s} .sp .beam{fill:${t.beam}}`;
  return css;
}

// ---------- resolved colours for the exported SVG files ----------

function parseC(c) {
  if (c === 'transparent') return [0, 0, 0, 0];
  if (c[0] === '#') {
    const h = c.slice(1);
    const n = h.length === 3 ? h.split('').map(x => x + x).join('') : h;
    return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16), n.length === 8 ? parseInt(n.slice(6, 8), 16) / 255 : 1];
  }
  const p = c.match(/\(([^)]+)\)/)[1].split(',').map(Number);
  return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
}

// CSS color-mix interpolates premultiplied alpha; do the same so exports match the page.
function mixC(a, pa, b) {
  const alpha = a[3] * pa + b[3] * (1 - pa);
  if (alpha === 0) return [0, 0, 0, 0];
  const ch = i => (a[i] * a[3] * pa + b[i] * b[3] * (1 - pa)) / alpha;
  return [ch(0), ch(1), ch(2), alpha];
}

function toC([r, g, b, a]) {
  const hex = v => Math.round(v).toString(16).padStart(2, '0');
  return a >= 0.999 ? `#${hex(r)}${hex(g)}${hex(b)}` : `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${+a.toFixed(3)})`;
}

function specColor(spec, accent) {
  const acc = parseC(accent);
  switch (spec[0]) {
    case 'acc': return acc;
    case 'mix': return mixC(acc, spec[1] / 100, parseC(spec[2]));
    case 'alpha': return [acc[0], acc[1], acc[2], spec[1]];
    default: return parseC(spec[1]);
  }
}

// one material's base colour (the left-face fill) as a plain colour string
export function matColor(t, mat, accent) { return toC(specColor(t.mats[mat], accent)); }

export function resolveSVG(markup, accent, t) {
  const WHITE = [255, 255, 255, 1], BLACK = [0, 0, 0, 1];
  const stroke = t.stroke ? toC(specColor(t.stroke, accent)) : null;
  return markup.replace(/<(polygon|path|ellipse|circle|rect|text)\b([^>]*?)class="([^"]*)"/g, (all, tag, pre, cls) => {
    const c = cls.split(/\s+/);
    const add = [];
    if (tag === 'text') {
      if (c.includes('t-sign')) add.push(`fill="${t.text}"`);
      if (c.includes('t-inv')) add.push('fill="#ffffff"');
      return `<${tag}${pre}${add.join(' ')} class="${cls}"`;
    }
    if (c.includes('shadow')) return `<${tag}${pre}fill="rgba(0,0,0,.14)" class="${cls}"`;
    if (c.includes('hl')) return `<${tag}${pre}fill="${t.hl}" class="${cls}"`;
    if (c.includes('smoke')) return `<${tag}${pre}fill="${t.smoke}" class="${cls}"`;
    if (c.includes('beam')) return `<${tag}${pre}fill="${t.beam}" class="${cls}"`;
    const m = c.find(x => x.startsWith('m-'));
    if (!m) return all;
    const base = specColor(t.mats[m.slice(2)], accent);
    if (c.includes('ln') || c.includes('ln2')) {
      return `<${tag}${pre}fill="none" stroke="${toC(base)}" stroke-width="${c.includes('ln2') ? 3 : 1.6}" stroke-linecap="round" stroke-linejoin="round" class="${cls}"`;
    }
    let col = base;
    if (c.includes('f-t')) col = mixC(base, 1 - t.shade[0] / 100, WHITE);
    if (c.includes('f-r')) col = mixC(base, 1 - t.shade[1] / 100, BLACK);
    add.push(`fill="${toC(col)}"`);
    if (stroke && !c.includes('nost')) add.push(`stroke="${stroke}" stroke-width="${t.strokeW}" stroke-linejoin="round"`);
    return `<${tag}${pre}${add.join(' ')} class="${cls}"`;
  });
}

// ---- sprites.js ----
// Papertown sprite library: isometric buildings, props, item icons and worker avatars.
// Everything is drawn from code into SVG strings. Shapes carry a material class (m-*)
// and a face class (f-t top / f-l left / f-r right); the theme decides the colours.

export const TW = 64, TH = 32, ZU = 26;
const HW = TW / 2, HH = TH / 2, R2 = Math.SQRT2;
export const iso = (x, y, z = 0) => [(x - y) * HW, (x + y) * HH - z * ZU];
const r1 = n => Math.round(n * 10) / 10;
const pt = p => `${r1(p[0])},${r1(p[1])}`;

// Hand-drawn mode: every polygon comes out as a slightly wobbly wash of colour plus a
// separate ink line drawn over it, a little off register and overshooting the corners,
// like a sketch coloured in afterwards. The wobble is seeded by the coordinates, so the
// same shape always draws the same way and shared edges get the same stroke.
let HAND = false;
export function handDrawn(on = true) { HAND = on; }
export const isHand = () => HAND;

function noise(a, b, c) {
  let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (((h ^ (h >>> 16)) >>> 0) / 4294967296) * 2 - 1;
}
const q4 = v => Math.round(v * 4);
const jit = (p, k, amp) => [p[0] + noise(q4(p[0]), q4(p[1]), k) * amp, p[1] + noise(q4(p[1]), q4(p[0]), k + 7) * amp];

function bowed(a, b, k, amount) {
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const off = noise(q4(mx), q4(my), k) * Math.min(amount, len * 0.03);
  return [mx - (b[1] - a[1]) / len * off, my + (b[0] - a[0]) / len * off];
}

function washPath(P) {
  const Q = P.map(p => jit(p, 1, 0.55));
  let d = `M${pt(Q[0])}`;
  for (let i = 0; i < Q.length; i++) {
    const a = Q[i], b = Q[(i + 1) % Q.length];
    d += Math.hypot(b[0] - a[0], b[1] - a[1]) < 6 ? `L${pt(b)}` : `Q${pt(bowed(a, b, 3, 1.1))} ${pt(b)}`;
  }
  return d + 'Z';
}

// the same two strokes for shapes drawn outside a Pen (screen points)
export function handPath(P) { return { wash: washPath(P), ink: inkPath(P) }; }

function inkPath(P) {
  let d = '';
  for (let i = 0; i < P.length; i++) {
    // draw each edge in one canonical direction so a shared edge is the same stroke
    let a = P[i], b = P[(i + 1) % P.length];
    if (a[0] > b[0] || (a[0] === b[0] && a[1] > b[1])) [a, b] = [b, a];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (len < 2.5) continue;
    const ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len, over = Math.min(1.8, len * 0.1);
    const o1 = over * (0.5 + 0.5 * noise(q4(a[0]), q4(a[1]), 11)), o2 = over * (0.5 + 0.5 * noise(q4(b[0]), q4(b[1]), 12));
    const A = jit([a[0] - ux * o1, a[1] - uy * o1], 5, 0.45), B = jit([b[0] + ux * o2, b[1] + uy * o2], 6, 0.45);
    d += `M${pt(A)}Q${pt(bowed(A, B, 9, 0.9))} ${pt(B)}`;
  }
  return d;
}

export class Pen {
  // k draws everything k times its size: the core buildings stand larger than life
  constructor(k = 1) { this.k = k; this.o = []; this.bb = [1e9, 1e9, -1e9, -1e9]; }
  I(x, y, z = 0) { const k = this.k; return iso(x * k, y * k, z * k); }
  grow(x, y) {
    const b = this.bb;
    if (x < b[0]) b[0] = x; if (y < b[1]) b[1] = y; if (x > b[2]) b[2] = x; if (y > b[3]) b[3] = y;
  }
  P(x, y, z = 0) { const p = this.I(x, y, z); this.grow(p[0], p[1]); return p; }
  raw(s) { this.o.push(s); return this; }
  poly(pts, cls) {
    const P = pts.map(q => this.P(q[0], q[1], q[2]));
    if (!HAND) {
      this.o.push(`<polygon class="${cls}" points="${P.map(pt).join(' ')}"/>`);
      return this;
    }
    const w = Math.max(...P.map(p => p[0])) - Math.min(...P.map(p => p[0])), h = Math.max(...P.map(p => p[1])) - Math.min(...P.map(p => p[1]));
    this.o.push(`<path class="${cls} wash" d="${washPath(P)}"/><path class="ink${w * h < 90 ? ' ink-s' : ''}" d="${inkPath(P)}"/>`);
    return this;
  }
  line(pts, cls) {
    const P = pts.map(q => this.P(q[0], q[1], q[2]));
    const d = HAND ? `M${pt(jit(P[0], 2, 0.5))}` + P.slice(1).map((p, i) => `Q${pt(bowed(P[i], p, 4, 0.8))} ${pt(jit(p, 2, 0.5))}`).join('') : `M${P.map(pt).join('L')}`;
    this.o.push(`<path class="${cls}" d="${d}"/>`);
    return this;
  }
  path(d, cls, box = []) { box.forEach(([x, y]) => this.grow(x, y)); this.o.push(`<path class="${cls}" d="${d}"/>`); return this; }
  ell(cx, cy, rx, ry, cls) {
    this.grow(cx - rx, cy - ry); this.grow(cx + rx, cy + ry);
    this.o.push(`<ellipse class="${cls}" cx="${r1(cx)}" cy="${r1(cy)}" rx="${r1(rx)}" ry="${r1(ry)}"/>`);
    return this;
  }
  circ(cx, cy, r, cls) { return this.ell(cx, cy, r, r, cls); }

  // ---- solids ----
  box(x, y, z, w, d, h, m) {
    this.poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], `${m} f-l`);
    this.poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], `${m} f-r`);
    this.poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], `${m} f-t`);
    return this;
  }
  // ridge along x; the gable end faces +x (right)
  gableX(x, y, z, w, d, rh, m, me = m) {
    const ym = y + d / 2, zt = z + rh;
    this.poly([[x, y, z], [x + w, y, z], [x + w, ym, zt], [x, ym, zt]], `${m} f-t`);
    this.poly([[x, y + d, z], [x + w, y + d, z], [x + w, ym, zt], [x, ym, zt]], `${m} f-l`);
    this.poly([[x + w, y, z], [x + w, y + d, z], [x + w, ym, zt]], `${me} f-r`);
    return this;
  }
  // ridge along y; the gable end faces +y (left)
  gableY(x, y, z, w, d, rh, m, me = m) {
    const xm = x + w / 2, zt = z + rh;
    this.poly([[x, y, z], [x, y + d, z], [xm, y + d, zt], [xm, y, zt]], `${m} f-t`);
    this.poly([[x + w, y, z], [x + w, y + d, z], [xm, y + d, zt], [xm, y, zt]], `${m} f-r`);
    this.poly([[x, y + d, z], [x + w, y + d, z], [xm, y + d, zt]], `${me} f-l`);
    return this;
  }
  pyramid(x, y, z, w, d, rh, m) {
    const a = [x + w / 2, y + d / 2, z + rh];
    this.poly([[x, y, z], [x + w, y, z], a], `${m} f-t`);
    this.poly([[x, y, z], [x, y + d, z], a], `${m} f-t`);
    this.poly([[x, y + d, z], [x + w, y + d, z], a], `${m} f-l`);
    this.poly([[x + w, y, z], [x + w, y + d, z], a], `${m} f-r`);
    return this;
  }
  // factory roof: n teeth rising along +x, glazing faces +x
  sawtooth(x, y, z, w, d, n, th, m, mg) {
    const s = w / n;
    for (let i = 0; i < n; i++) {
      const x0 = x + i * s, x1 = x0 + s;
      this.poly([[x0, y, z], [x0, y + d, z], [x1, y + d, z + th], [x1, y, z + th]], `${m} f-t`);
      this.poly([[x0, y + d, z], [x1, y + d, z], [x1, y + d, z + th]], `${m} f-l`);
      this.poly([[x1, y, z], [x1, y + d, z], [x1, y + d, z + th], [x1, y, z + th]], `${mg} f-r`);
    }
    return this;
  }
  cyl(cx, cy, z, r, h, m, cap = true) {
    const k = this.k, [sx, sb] = this.I(cx, cy, z), st = sb - h * k * ZU, rx = r * k * HW * R2, ry = r * k * HH * R2;
    this.path(`M${r1(sx - rx)},${r1(st)}L${r1(sx - rx)},${r1(sb)}A${r1(rx)},${r1(ry)} 0 0 0 ${r1(sx)},${r1(sb + ry)}L${r1(sx)},${r1(st)}Z`,
      `${m} f-l`, [[sx - rx, st - ry], [sx, sb + ry]]);
    this.path(`M${r1(sx)},${r1(st)}L${r1(sx)},${r1(sb + ry)}A${r1(rx)},${r1(ry)} 0 0 0 ${r1(sx + rx)},${r1(sb)}L${r1(sx + rx)},${r1(st)}Z`,
      `${m} f-r`, [[sx + rx, st]]);
    if (cap) this.ell(sx, st, rx, ry, `${m} f-t`);
    return this;
  }
  dome(cx, cy, z, r, hd, m) {
    const k = this.k, [sx, sy] = this.I(cx, cy, z), rx = r * k * HW * R2, ry = r * k * HH * R2, hz = hd * k * ZU;
    this.path(`M${r1(sx - rx)},${r1(sy)}A${r1(rx)},${r1(hz)} 0 0 1 ${r1(sx + rx)},${r1(sy)}A${r1(rx)},${r1(ry)} 0 0 1 ${r1(sx - rx)},${r1(sy)}Z`,
      `${m} f-l`, [[sx - rx, sy - hz], [sx + rx, sy + ry]]);
    this.path(`M${r1(sx)},${r1(sy - hz)}A${r1(rx)},${r1(hz)} 0 0 1 ${r1(sx + rx)},${r1(sy)}A${r1(rx)},${r1(ry)} 0 0 1 ${r1(sx)},${r1(sy + ry)}Z`, `${m} f-r`);
    this.ell(sx - rx * 0.38, sy - hz * 0.55, rx * 0.16, hz * 0.14, 'hl');
    return this;
  }
  egg(cx, cy, z, r, h, m) {
    const k = this.k, [sx, sy] = this.I(cx, cy, z), rx = r * k * HW * R2, ry = r * k * HH * R2, hz = h * k * ZU;
    const L = r1(sx - rx), R = r1(sx + rx), X = r1(sx), Y = r1(sy), T = r1(sy - hz);
    this.path(`M${L},${Y}C${L},${r1(sy - hz * 0.55)} ${r1(sx - rx * 0.62)},${T} ${X},${T}C${r1(sx + rx * 0.62)},${T} ${R},${r1(sy - hz * 0.55)} ${R},${Y}A${r1(rx)},${r1(ry)} 0 0 1 ${L},${Y}Z`,
      `${m} f-l`, [[sx - rx, sy - hz], [sx + rx, sy + ry]]);
    this.path(`M${X},${T}C${r1(sx + rx * 0.62)},${T} ${R},${r1(sy - hz * 0.55)} ${R},${Y}A${r1(rx)},${r1(ry)} 0 0 1 ${X},${r1(sy + ry)}Z`, `${m} f-r`);
    this.ell(sx - rx * 0.4, sy - hz * 0.62, rx * 0.12, hz * 0.12, 'hl');
    return this;
  }
  cooling(cx, cy, z, r, h, m) {
    const k = this.k, [sx, sb] = this.I(cx, cy, z), rx = r * k * HW * R2, ry = r * k * HH * R2;
    const st = sb - h * k * ZU, sm = sb - h * k * ZU * 0.62, rt = rx * 0.7, rw = rx * 0.6, rty = ry * 0.7;
    this.path(`M${r1(sx - rx)},${r1(sb)}Q${r1(sx - rw)},${r1(sm)} ${r1(sx - rt)},${r1(st)}L${r1(sx)},${r1(st)}L${r1(sx)},${r1(sb + ry)}A${r1(rx)},${r1(ry)} 0 0 1 ${r1(sx - rx)},${r1(sb)}Z`,
      `${m} f-l`, [[sx - rx, st - rty], [sx + rx, sb + ry]]);
    this.path(`M${r1(sx)},${r1(st)}L${r1(sx + rt)},${r1(st)}Q${r1(sx + rw)},${r1(sm)} ${r1(sx + rx)},${r1(sb)}A${r1(rx)},${r1(ry)} 0 0 1 ${r1(sx)},${r1(sb + ry)}Z`, `${m} f-r`);
    this.ell(sx, st, rt, rty, `${m} f-t`);
    this.ell(sx, st, rt * 0.75, rty * 0.7, 'm-dark f-l');
    return this;
  }

  // ---- facade details ----
  winL(Y, x0, z0, w, h, m = 'm-win') { return this.poly([[x0, Y, z0], [x0 + w, Y, z0], [x0 + w, Y, z0 + h], [x0, Y, z0 + h]], `${m} f-l`); }
  winR(X, y0, z0, w, h, m = 'm-win') { return this.poly([[X, y0, z0], [X, y0 + w, z0], [X, y0 + w, z0 + h], [X, y0, z0 + h]], `${m} f-r`); }
  rowL(Y, x0, x1, z, n, w, h, m) { const g = (x1 - x0 - n * w) / (n - 1 || 1); for (let i = 0; i < n; i++) this.winL(Y, x0 + i * (w + g), z, w, h, m); return this; }
  rowR(X, y0, y1, z, n, w, h, m) { const g = (y1 - y0 - n * w) / (n - 1 || 1); for (let i = 0; i < n; i++) this.winR(X, y0 + i * (w + g), z, w, h, m); return this; }
  textL(x, Y, z, s, size = 10, cls = 't-sign') {
    const [px, py] = this.P(x, Y, z);
    this.o.push(`<text class="${cls}" transform="matrix(.894 .447 0 1 ${r1(px)} ${r1(py)})" font-size="${r1(size * this.k)}" text-anchor="middle">${s}</text>`);
    return this;
  }
  textR(X, y, z, s, size = 10, cls = 't-sign') {
    const [px, py] = this.P(X, y, z);
    this.o.push(`<text class="${cls}" transform="matrix(.894 -.447 0 1 ${r1(px)} ${r1(py)})" font-size="${r1(size * this.k)}" text-anchor="middle">${s}</text>`);
    return this;
  }
  boardL(Y, x0, x1, z0, z1, s, size = 10) {
    this.winL(Y, x0, z0, x1 - x0, z1 - z0, 'm-sign');
    return this.textL((x0 + x1) / 2, Y, z0 + (z1 - z0) * 0.5 - size * 0.36 / ZU, s, size);
  }
  // a flat glyph painted on a left (+y) face, drawn in the face's own 2D space
  decalL(x, Y, z, inner) {
    const [px, py] = this.P(x, Y, z);
    this.grow(px - 12, py - 12); this.grow(px + 12, py + 12);
    this.o.push(`<g transform="matrix(.894 .447 0 1 ${r1(px)} ${r1(py)})">${inner}</g>`);
    return this;
  }
  decalR(X, y, z, inner) {
    const [px, py] = this.P(X, y, z);
    this.grow(px - 12, py - 12); this.grow(px + 12, py + 12);
    this.o.push(`<g transform="matrix(.894 -.447 0 1 ${r1(px)} ${r1(py)})">${inner}</g>`);
    return this;
  }
  smoke(cx, cy, z, s = 1) {
    const [x, y] = this.I(cx, cy, z);
    s *= this.k;
    this.o.push(`<g class="smoke-g"><circle class="smoke s1" cx="${r1(x)}" cy="${r1(y - 6 * s)}" r="${r1(5 * s)}"/>` +
      `<circle class="smoke s2" cx="${r1(x + 5 * s)}" cy="${r1(y - 16 * s)}" r="${r1(7 * s)}"/>` +
      `<circle class="smoke s3" cx="${r1(x + 12 * s)}" cy="${r1(y - 29 * s)}" r="${r1(9 * s)}"/></g>`);
    this.grow(x - 6 * s, y - 40 * s); this.grow(x + 22 * s, y);
    return this;
  }
  flag(x, y, z, h, m = 'm-acc2') {
    this.box(x, y, z, 0.05, 0.05, h, 'm-metal');
    return this.poly([[x + 0.05, y + 0.05, z + h], [x + 0.6, y + 0.05, z + h - 0.12], [x + 0.05, y + 0.05, z + h - 0.28]], `${m} f-l`);
  }
  figure(x, y, m) {
    const [sx, sy] = this.P(x, y, 0);
    this.ell(sx, sy, 5, 2.5, 'shadow');
    this.path(`M${r1(sx - 4)},${r1(sy)}L${r1(sx - 4)},${r1(sy - 10)}Q${r1(sx - 4)},${r1(sy - 15)} ${r1(sx)},${r1(sy - 15)}Q${r1(sx + 4)},${r1(sy - 15)} ${r1(sx + 4)},${r1(sy - 10)}L${r1(sx + 4)},${r1(sy)}Z`, `${m} f-l`, [[sx - 4, sy - 24]]);
    return this.circ(sx, sy - 19, 4, 'm-egg f-l');
  }
  truck(x, y, m) {
    this.box(x, y, 0.06, 0.36, 1.0, 0.42, m);
    this.box(x, y + 1.03, 0.06, 0.36, 0.3, 0.34, 'm-acc2');
    return this.winL(y + 1.33, x + 0.05, 0.24, 0.26, 0.12, 'm-glass');
  }

  svg(cls = '', style = '', pad = 6) {
    const [x0, y0, x1, y1] = this.bb;
    const vb = `${r1(x0 - pad)} ${r1(y0 - pad)} ${r1(x1 - x0 + pad * 2)} ${r1(y1 - y0 + pad * 2)}`;
    return { vb, w: x1 - x0 + pad * 2, h: y1 - y0 + pad * 2, body: `<g class="sp ${cls}"${style ? ` style="${style}"` : ''}>${this.o.join('')}</g>` };
  }
}

// ---- world.js ----
// The Papertown map: placements on a 24×24 isometric grid, ground tiles, props,
// logistics flows and labels. renderMap() returns one <svg> string.
//
// The board is a 3×3 grid of areas. The four core buildings each own a 7×7 yard in a
// corner (造纸厂 at the top of the screen, then clockwise 仓库, 实验农场, 印刷厂) and
// are drawn larger than life. The strips between two neighbouring yards hold the small
// buildings that serve both, and the square in the middle is where an idea is written
// down, checked and handed to the mill. A ring road joins the yards in work order:
// mill → depot → farm → press → mill. The far shores are sea, with a dock in each of
// the two strips that touch it.

export function scaleOf(pl) { return SCALE[pl.type] || 1; }

export function footprint(pl) {
  const b = BUILDINGS[pl.type], k = scaleOf(pl);
  return { x: pl.x, y: pl.y, w: (b?.w ?? 1) * k, d: (b?.d ?? 1) * k };
}

// the 7×7 yard a core building stands in
function yardOf(pl) {
  const f = footprint(pl), near = v => YARD.reduce((a, c) => Math.abs(c - v) < Math.abs(a - v) ? c : a);
  const cx = near(f.x + f.w / 2), cy = near(f.y + f.d / 2);
  return { x0: cx - 3.5, y0: cy - 3.5, x1: cx + 3.5, y1: cy + 3.5 };
}

// a rounded square inset from the yard's edges, in tile coordinates
function yardOutline(r, inset = 0.3, rad = 1.3) {
  const pts = [], x0 = r.x0 + inset, y0 = r.y0 + inset, x1 = r.x1 - inset, y1 = r.y1 - inset;
  const corners = [[x1 - rad, y0 + rad, -90], [x1 - rad, y1 - rad, 0], [x0 + rad, y1 - rad, 90], [x0 + rad, y0 + rad, 180]];
  for (const [cx, cy, a0] of corners) {
    for (let i = 0; i <= 3; i++) {
      const a = (a0 + i * 30) * Math.PI / 180;
      pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
    }
  }
  return pts;
}

// each core building's yard as an outline in tile coordinates, with its accent
export function yards(places) {
  return places.filter(p => SCALE[p.type]).map(pl => ({ id: pl.id, pts: yardOutline(yardOf(pl)), accent: pl.accent || BUILDINGS[pl.type].accent }));
}

const CORE_FEET = PLACEMENTS.filter(p => SCALE[p.type]).map(footprint);
const under = (x, y) => CORE_FEET.some(f => x + 1 > f.x && x < f.x + f.w && y + 1 > f.y && y < f.y + f.d);

function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

export function tileMat(x, y) {
  if (x === 0 && y === 12) return 'sand'; // the lighthouse rock
  if (x === 0 || y === 0 || BAYS.has(`${x},${y}`)) return 'water';
  const ring = (RING.includes(y) && x >= RING[0] && x <= RING[1]) || (RING.includes(x) && y >= RING[0] && y <= RING[1]);
  if (ring && !under(x, y)) return 'road';
  if (x >= 9 && x <= 14 && y >= 9 && y <= 14) return 'plaza';
  return hash(x, y) < 0.3 ? 'grass2' : 'grass';
}

const f1 = n => Math.round(n * 10) / 10;
const sp = (x, y, z = 0) => iso(x, y, z).map(f1).join(',');

function textWidth(s, size) {
  let w = 0;
  for (const ch of s) w += /[　-鿿＀-￯]/.test(ch) ? size : size * 0.58;
  return w;
}

function pill(x, y, text, cls, size = 12, style = '') {
  const w = textWidth(text, size) + 16, h = size + 9;
  // hand-drawn: a wobbly tag with an ink outline instead of a perfect capsule
  const shape = isHand()
    ? (() => { const P = [[-w / 2, -h], [w / 2, -h], [w / 2 + 2, -h / 2], [w / 2, 0], [-w / 2, 0], [-w / 2 - 2, -h / 2]]; const d = handPath(P); return `<path class="tag" d="${d.wash}"/><path class="tag-ink" d="${d.ink}"/>`; })()
    : `<rect x="${f1(-w / 2)}" y="${-h}" width="${f1(w)}" height="${h}" rx="${h / 2}"/>`;
  return `<g class="${cls}"${style ? ` style="${style}"` : ''} transform="translate(${f1(x)},${f1(y)})">${shape}` +
    `<text x="0" y="${f1(-h / 2 + size * 0.36)}" font-size="${size}" text-anchor="middle">${text}</text></g>`;
}

export function placementName(pl) { return pl.name || BUILDINGS[pl.type].name; }

// trees, and for 'full' lamps and boats, kept clear of the buildings and their yards; the
// same every time. k is the painter-sort key.
// decor: 'full'; 'light' a few trees; 'none'.
export function decorItems(places, decor = 'full') {
  const items = [];
  if (decor === 'none') return items;
  const blocked = new Set();
  for (const pl of places) {
    const f = footprint(pl), r = SCALE[pl.type] ? yardOf(pl) : { x0: f.x - 1, y0: f.y - 1, x1: f.x + f.w + 1, y1: f.y + f.d + 1 };
    for (let x = Math.floor(r.x0); x < r.x1; x++) for (let y = Math.floor(r.y0); y < r.y1; y++) blocked.add(`${x},${y}`);
  }
  const light = decor === 'light';
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    const m = tileMat(x, y);
    if (!m.startsWith('grass') || blocked.has(`${x},${y}`)) continue;
    const rim = x >= N - 1 || y >= N - 1; // the near shore, where a few trees frame the board
    if (hash(x, y, 3) < (rim ? 0.55 : 0.18) * (light ? 0.3 : 1)) {
      const jx = (hash(x, y, 4) - 0.5) * 0.3, jy = (hash(x, y, 5) - 0.5) * 0.3;
      items.push({ k: x + y + 1, prop: hash(x, y, 6) < 0.5 ? 'tree_pine' : 'tree_round', x: x + jx, y: y + jy });
    }
  }
  if (decor === 'full') {
    for (const [x, y] of LAMPS) items.push({ k: x + y + 1, prop: 'lamp', x: x - 0.5, y: y - 0.5 });
    for (const [x, y] of BOATS) items.push({ k: x + y + 0.8, prop: 'boat', x, y, cls: 'bob' });
  }
  return items;
}

// placements: live placements from the server (default: the static design ones); a
// placement's `key` decides whether it is labelled, `status: 'busy'` marks it working,
// `core` puts a pad under it and dims everything that is not core.
// notes: placement id -> text appended to its label.
// decor: 'full' trees, lamps and boats; 'light' a few trees kept clear of core buildings; 'none'.
// dashes: centre lines on the roads.
export function renderMap(o = {}) {
  const opt = { labels: 'key', anim: true, objects: true, flows: true, districts: true, decor: 'full', dashes: true, highlight: null, note: '', notes: {}, vb: '-790 -150 1580 950', ...o };
  const places = opt.placements || PLACEMENTS;
  const hasCore = places.some(p => p.core);
  const accent = pl => pl.accent || BUILDINGS[pl.type].accent;
  const out = [];

  // board edge
  const edge = new Pen();
  edge.poly([[0, N, -0.6], [N, N, -0.6], [N, N, 0], [0, N, 0]], 'm-edge f-l');
  edge.poly([[N, 0, -0.6], [N, N, -0.6], [N, N, 0], [N, 0, 0]], 'm-edge f-r');
  out.push(`<g class="sp">${edge.o.join('')}</g>`);

  // ground tiles merged per material
  const groups = {};
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    const m = tileMat(x, y);
    (groups[m] = groups[m] || []).push(`M${sp(x, y)}L${sp(x + 1, y)}L${sp(x + 1, y + 1)}L${sp(x, y + 1)}Z`);
  }
  out.push(`<g class="sp ground">${Object.entries(groups).map(([m, d]) => `<path class="m-${m} f-l tile nost" d="${d.join('')}"/>`).join('')}</g>`);

  // road centre dashes (one per tile, along the ring) and water ripples
  const dash = [], waves = [];
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    const m = tileMat(x, y);
    if (m === 'road') {
      if (RING.includes(y)) dash.push(`M${sp(x + 0.22, y + 0.5)}L${sp(x + 0.78, y + 0.5)}`);
      if (RING.includes(x)) dash.push(`M${sp(x + 0.5, y + 0.22)}L${sp(x + 0.5, y + 0.78)}`);
    } else if (m === 'water' && hash(x, y, 7) < 0.4) {
      const [cx, cy] = iso(x + 0.5, y + 0.5);
      waves.push(`M${f1(cx - 9)},${f1(cy)}q4.5,-4 9,0t9,0`);
    }
  }
  out.push(`<g class="sp">${opt.dashes ? `<path class="ln m-white roaddash" d="${dash.join('')}"/>` : ''}<path class="ln m-white wave" d="${waves.join('')}"/></g>`);

  // focus ring under the highlighted building
  const hl = opt.highlight && places.find(p => p.id === opt.highlight);
  if (hl) {
    const f = footprint(hl), [cx, cy] = iso(f.x + f.w / 2, f.y + f.d / 2, 0.05), rx = (f.w + f.d) / 2 * 32 * 1.25;
    out.push(`<ellipse class="focus" cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(rx / 2)}"/>`);
  }

  // each core building's yard: a rounded square of tinted ground filling its corner
  if (opt.objects) {
    for (const { pts, accent: acc } of yards(places)) {
      if (isHand()) {
        const d = handPath(pts.map(([x, y]) => iso(x, y, 0.02)));
        out.push(`<g class="core-pad-g" style="--accent:${acc}"><path class="core-pad" d="${d.wash}"/><path class="core-pad-ink" d="${d.ink}"/></g>`);
      } else {
        out.push(`<path class="core-pad" style="--accent:${acc}" d="M${pts.map(([x, y]) => sp(x, y, 0.02)).join('L')}Z"/>`);
      }
    }
  }

  // flows run on the roads, under the buildings
  if (opt.flows) {
    for (const fl of FLOWS) {
      const d = 'M' + fl.pts.map(([x, y]) => sp(x, y, 0.15)).join('L');
      out.push(`<path class="flowpath fp-${fl.kind}" d="${d}"/>`);
      const dots = opt.anim ? [0, 0.5] : [0.35];
      for (const k of dots) {
        if (opt.anim) {
          out.push(`<circle class="fdot fd-${fl.kind}" r="5.5"><animateMotion dur="${fl.dur}s" begin="-${f1(fl.dur * k)}s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".42 0 .3 1" path="${d}"/></circle>`);
        } else {
          const [x, y] = fl.pts[Math.min(1, fl.pts.length - 1)];
          const [sx, sy] = iso(x, y, 0.15);
          out.push(`<circle class="fdot fd-${fl.kind}" r="5.5" cx="${f1(sx)}" cy="${f1(sy)}"/>`);
        }
      }
    }
  }

  // objects, painter-sorted by footprint centre
  if (opt.objects) {
    const objs = places.map(pl => { const f = footprint(pl); return { k: f.x + f.w / 2 + f.y + f.d / 2, pl }; });
    objs.push(...decorItems(places, opt.decor));
    objs.sort((a, b) => a.k - b.k);

    for (const ob of objs) {
      if (ob.pl) {
        const pl = ob.pl, b = BUILDINGS[pl.type], p = new Pen(scaleOf(pl));
        b.draw(p, pl);
        const [tx, ty] = iso(pl.x, pl.y);
        const cls = `${pl.id === opt.highlight ? ' is-hl' : ''}${pl.status === 'busy' ? ' is-busy' : ''}${pl.core ? ' is-core' : hasCore ? ' is-dim' : ''}`;
        out.push(`<g class="sp bld${cls}" data-b="${pl.type}" data-id="${pl.id}" style="--accent:${accent(pl)}" transform="translate(${f1(tx)},${f1(ty)})"><g class="bld-in">${p.o.join('')}</g></g>`);
      } else {
        const p = new Pen();
        PROPS[ob.prop].draw(p);
        const [tx, ty] = iso(ob.x, ob.y);
        out.push(`<g transform="translate(${f1(tx)},${f1(ty)})"><g class="sp ${ob.cls || ''}" style="--accent:#c47a3a">${p.o.join('')}</g></g>`);
      }
    }
  }

  // labels on top
  if (opt.districts) {
    for (const [k, x, y, z] of DISTRICT_LABELS) {
      const [sx, sy] = iso(x, y, z);
      out.push(pill(sx, sy, DISTRICTS[k].name, 'dlbl', 15));
    }
  }
  if (opt.labels !== 'none' && opt.objects) {
    for (const pl of places) {
      const isHl = pl.id === opt.highlight;
      if (opt.labels === 'key' && !(pl.key ?? KEY_LABELS.has(pl.id)) && !isHl) continue;
      const b = BUILDINGS[pl.type], f = footprint(pl);
      const [sx, sy] = iso(f.x + f.w / 2, f.y + f.d / 2, b.h * scaleOf(pl) + 0.5);
      const note = (isHl && opt.note) || opt.notes[pl.id];
      const text = note ? `${placementName(pl)} · ${note}` : placementName(pl);
      out.push(isHl ? pill(sx, sy, text, 'blbl hl', 12) : pl.core ? pill(sx, sy, text, 'blbl core', 13, `--accent:${accent(pl)}`) : pill(sx, sy, text, 'blbl', 12));
    }
  }

  return `<svg class="map${opt.anim ? ' anim' : ''}" viewBox="${opt.vb}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${out.join('')}</svg>`;
}

  <aside class="p-drawer pnl" id="drawer" data-show="chat">${benchHTML({ closable: true, extra: `
    <div class="bench-pane" data-pane="line"><div class="pane-pad">
      <h5>造纸厂 #1 · VLA 场景图规划</h5>
      <ol class="steps">${STAGES.map((s, i) => `<li class="${s.st}" data-open="${s.b}"><i>${i + 1}</i><b>${s.name}</b><span>${placementName(place(s.b))}</span></li>`).join('')}</ol>
    </div></div>
    <div class="bench-pane" data-pane="trace"><div class="pane-pad">
      <h5>最近的调用</h5>
      <div class="trace-rows" id="trace-all">${TRACE.map(traceRow).join('')}</div>
    </div></div>` })}</aside>

  <div class="p-modal" id="modal" hidden><div class="p-sheet pnl lc" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="ptip pnl" id="tip" hidden></div>
  <span class="demo-tag">原型 · 示意数据</span>
</div>`;

const $ = id => document.getElementById(id);
const root = $('proto');

// ---------- views ----------

function setView(v) {
  root.dataset.mode = v;
  root.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('hud-stats').innerHTML = HUD[v].map(([k, val]) => `<div><i>${k}</i><b>${val}</b></div>`).join('');
  $('tip').hidden = true;
  if (v === 'world') requestAnimationFrame(applyVB);
}

// ---------- building detail (C) ----------

function openDetail(key) {
  const pl = place(key);
  if (!pl) return;
  const b = BUILDINGS[pl.type], d = DISTRICTS[b.district];
  const head = (title, sub, chips) => `
    <header class="sh-head">
      <div class="sh-art">${spriteSVG(pl.type, { label: pl.label, accent: pl.accent }).html}</div>
      <div class="sh-t">
        <div class="crumbs">世界 / ${d.name} / <b>${placementName(pl)}</b></div>
        <h2>${title}</h2>
        <p>${sub}</p>
        <div class="sh-chips">${chips}</div>
      </div>
      <div class="sh-btns">
        <button class="btn" data-act="ask" data-ask="${pl.id}">问问这里的员工</button>
        <button class="sh-x" data-act="close" title="关闭 Esc">×</button>
      </div>
    </header>`;

  let html;
  if (pl.type === 'mill') {
    html = head('造纸厂 #1「VLA × 结构化场景图规划」', '一篇论文一座厂。下面是这篇论文从灵感到出港的 8 道工序，点工序可以跳到它所在的建筑。',
      `<span class="chip">${b.tech}</span><span class="chip pri">方法设计 60%</span><span class="chip">预算 $0.42 / $1.00</span>`) +
      pipelineHTML(STAGES) + `<section class="detail">${millPanels()}</section>`;
  } else {
    const f = flowOf(pl), r = f.repo;
    const cur = f.stations.find(s => s.st === 'run') || f.stations[f.stations.length - 1];
    const team = [...new Set(f.stations.flatMap(s => s.team))];
    const goods = (list, dir) => list.length ? list.map(([id, it]) => {
      const p2 = place(id);
      return `<div class="io" data-open="${id}">${itemSVG(it)}<div><b>${dir} ${placementName(p2)}</b><small>${ITEMS[it].name}</small></div><span class="go">→</span></div>`;
    }).join('') : '<p class="muted">—</p>';
    const chips = list => list.length ? list.map(x => `<span class="chip">${x}</span>`).join('') : '<span class="muted">—</span>';
    html = head(`${placementName(pl)} · ${f.job}`, b.rep,
      `<span class="chip">${b.tech}</span>${b.later ? '<span class="chip warn">以后再做</span>' : ''}<span class="chip pri">${cur.name}</span>`) +
      pipelineHTML(f.stations) + `
      <section class="detail">
        <div class="pnl">
          <h4>当前工位 · ${cur.name}</h4>
          <dl class="kv">
            <dt>员工</dt><dd>${team.length ? team.map(r => `${ava(r)} ${WORKERS[r].name}`).join(' ') : '<span class="muted">自动运行，没有 agent 员工</span>'}</dd>
            <dt>Skills</dt><dd>${chips(f.skills)}</dd>
            <dt>MCP</dt><dd>${chips(f.mcp)}</dd>
            <dt>说明</dt><dd>${f.note}</dd>
          </dl>
        </div>
        <div class="pnl">
          <h4>进货 / 出货</h4>
          <div class="io-list">${goods(f.from, '来自')}${goods(f.to, '送往')}</div>
        </div>
        <div class="pnl">
          ${r ? `<h4>仓库信息 <span class="chip">示例数据</span></h4>
          <dl class="kv">
            <dt>仓库</dt><dd>${r.repo}</dd>
            <dt>简介</dt><dd>${r.desc}</dd>
            <dt>语言</dt><dd>${r.lang} · ★ ${r.stars}</dd>
            <dt>Issue</dt><dd>${r.issues} 个 open · ${r.prs} 个 PR</dd>
            <dt>Release</dt><dd>${r.release} · ${r.updated}更新</dd>
          </dl>
          <p class="real muted">${f.real}接入后换成你自己的仓库。</p>`
          : `<h4>现实里对应什么</h4>
          <p class="real">${f.real}</p>`}
          <div class="btns"><button class="btn pri" data-act="ask" data-ask="${pl.id}">问问这里的员工</button><button class="btn" data-view="status">看运行状态</button></div>
        </div>
      </section>`;
  }
  const sheet = $('sheet');
  sheet.innerHTML = html;
  sheet.scrollTop = 0;
  $('modal').hidden = false;
  $('tip').hidden = true;
}

const closeDetail = () => { $('modal').hidden = true; };

// ---------- chat drawer (B) ----------

const chatEl = () => root.querySelector('.chat');
const input = () => root.querySelector('.composer input');

function setTab(t) {
  $('drawer').dataset.show = t;
  root.querySelectorAll('.bench-tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === t));
}

function openChat({ focus = false, placeholder } = {}) {
  root.classList.add('chat-open');
  setTab('chat');
  if (placeholder) input().placeholder = placeholder;
  if (focus) setTimeout(() => input().focus(), 280);
}
const closeChat = () => root.classList.remove('chat-open');

function addMsg(html, cls) {
  const m = document.createElement('div');
  m.className = `msg ${cls}`;
  m.innerHTML = html;
  chatEl().appendChild(m);
  chatEl().scrollTop = chatEl().scrollHeight;
  return m;
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function send() {
  const v = input().value.trim();
  if (!v) return;
  input().value = '';
  addMsg(esc(v), 'mine');
  const typing = addMsg('<span class="typing"><i></i><i></i><i></i></span>', 'bot');
  setTimeout(() => {
    typing.innerHTML = `<div class="who">${ava('hatcher', 2)}<b>孵化员 H-01</b></div>
      <p>收到。我先去图书馆和 arXiv 码头查有没有撞车的工作，报告出来会贴在这里。</p>
      <div class="cost">原型里这是一条预设回复</div>`;
    chatEl().scrollTop = chatEl().scrollHeight;
    const rows = [['SKILL', 'hatchery/novelty-check', '加载 SKILL.md'], ['MCP', `arxiv.search("${v.slice(0, 24)}")`, '检索中…']];
    $('trace-all').insertAdjacentHTML('afterbegin', rows.map(r => traceRow(r.map(esc))).join(''));
  }, 700);
}

function ask(id) {
  const pl = place(id), f = BUILDING_FLOWS[pl.type] && flowOf(pl);
  const role = pl.type === 'mill' ? 'designer' : f.stations.flatMap(s => s.team)[0] || 'scout';
  const cur = f && (f.stations.find(s => s.st === 'run') || f.stations[0]);
  openChat({ placeholder: `问问${placementName(pl)}…` });
  addMsg(`<div class="who">${ava(role)}<b>${WORKERS[role].name} · ${placementName(pl)}</b></div>
    <p>${pl.type === 'mill' ? '方法草案写到 v0.3 了，还差 baseline 的对比设计。想先看哪部分？' : `这里现在是「${f.job}」，进行到「${cur.name}」。想问什么？`}</p>`, 'bot');
  setTimeout(() => input().focus(), 280);
}

// ---------- pan & zoom ----------

const mapSvg = $('world').querySelector('svg');
const mmSvg = $('minimap').querySelector('svg');
let vb = { ...BASE };

function aspect() { const r = mapSvg.getBoundingClientRect(); return r.height / r.width || BASE.h / BASE.w; }

function applyVB() {
  const minW = 420, maxW = BASE.w * 1.5;
  const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2;
  vb.w = Math.min(maxW, Math.max(minW, vb.w));
  vb.h = vb.w * aspect();
  // keep the centre over the board
  const ncx = Math.min(BASE.x + BASE.w, Math.max(BASE.x, cx)), ncy = Math.min(BASE.y + BASE.h, Math.max(BASE.y, cy));
  vb.x = ncx - vb.w / 2; vb.y = ncy - vb.h / 2;
  mapSvg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const r = $('mm-rect');
  r.setAttribute('x', vb.x); r.setAttribute('y', vb.y); r.setAttribute('width', vb.w); r.setAttribute('height', vb.h);
}

function fitBoard() {
  const a = aspect();
  vb.w = Math.max(BASE.w, BASE.h / a) * 0.98;
  vb.h = vb.w * a;
  vb.x = BASE.x + BASE.w / 2 - vb.w / 2;
  vb.y = BASE.y + BASE.h / 2 - vb.h / 2 + 30;
  applyVB();
}

function svgPoint(svg, cx, cy) {
  const p = svg.createSVGPoint();
  p.x = cx; p.y = cy;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

function zoomAt(k, cx, cy) {
  const before = svgPoint(mapSvg, cx, cy);
  const nw = Math.min(BASE.w * 1.5, Math.max(420, vb.w * k));
  const s = nw / vb.w;
  vb.x = before.x - (before.x - vb.x) * s;
  vb.y = before.y - (before.y - vb.y) * s;
  vb.w = nw;
  applyVB();
}

function zoomCenter(k) {
  const r = mapSvg.getBoundingClientRect();
  zoomAt(k, r.left + r.width / 2, r.top + r.height / 2);
}

let drag = null, dragged = false;
mapSvg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
mapSvg.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y, id: e.pointerId };
  dragged = false;
});
addEventListener('pointermove', e => {
  if (!drag) {
    hover(e);
    return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragged && Math.hypot(dx, dy) < 4) return;
  if (!dragged) { dragged = true; mapSvg.setPointerCapture(drag.id); root.classList.add('panning'); $('tip').hidden = true; }
  const s = vb.w / mapSvg.getBoundingClientRect().width;
  vb.x = drag.vx - dx * s; vb.y = drag.vy - dy * s;
  applyVB();
});
addEventListener('pointerup', () => { drag = null; root.classList.remove('panning'); });

mmSvg.addEventListener('click', e => {
  const p = svgPoint(mmSvg, e.clientX, e.clientY);
  vb.x = p.x - vb.w / 2; vb.y = p.y - vb.h / 2;
  applyVB();
});

// ---------- hover tooltip ----------

function hover(e) {
  const tip = $('tip');
  const g = root.dataset.mode === 'world' && $('modal').hidden && e.target.closest?.('.p-world [data-b]');
  if (!g) { tip.hidden = true; return; }
  const pl = place(g.dataset.id), b = BUILDINGS[pl.type];
  tip.innerHTML = `<b>${placementName(pl)}</b><span>${DISTRICTS[b.district].name}</span><p>${b.rep}</p><em>${b.tech} · 点击查看流水线</em>`;
  const x = Math.min(e.clientX + 16, innerWidth - 300), y = Math.min(e.clientY + 16, innerHeight - 140);
  tip.style.left = `${x}px`; tip.style.top = `${y}px`; tip.hidden = false;
}

// ---------- events ----------

root.addEventListener('click', e => {
  const t = e.target;
  const bld = t.closest('.p-world [data-b]');
  if (bld) { if (!dragged) openDetail(bld.dataset.id); return; }
  if (t === $('modal')) { closeDetail(); return; }
  const c = t.closest('[data-act],[data-open],[data-view],[data-zoom],[data-tab]');
  if (!c) return;
  if (c.dataset.zoom) {
    if (c.dataset.zoom === 'reset') fitBoard(); else zoomCenter(c.dataset.zoom === 'in' ? 0.7 : 1.4);
  } else if (c.dataset.tab) setTab(c.dataset.tab);
  else if (c.dataset.view) { closeDetail(); setView(c.dataset.view); }
  else if (c.dataset.open) openDetail(c.dataset.open);
  else {
    const act = c.dataset.act;
    if (act === 'chat') root.classList.contains('chat-open') ? closeChat() : openChat();
    if (act === 'newidea') openChat({ focus: true, placeholder: '写下你的 idea，孵化员会先帮你查重…' });
    if (act === 'drawer-close') closeChat();
    if (act === 'legend') $('legend').hidden = !$('legend').hidden;
    if (act === 'close') closeDetail();
    if (act === 'ask') ask(c.dataset.ask);
    if (act === 'send') send();
  }
});

root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.composer input')) send(); });
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('modal').hidden) closeDetail();
  else if (root.classList.contains('chat-open')) closeChat();
});
addEventListener('resize', applyVB);

// ---------- start ----------

setView(hp.get('view') === 'status' ? 'status' : 'world');
fitBoard();
if (hp.has('chat')) openChat();
if (hp.get('open')) openDetail(hp.get('open'));

</script>
</body>
