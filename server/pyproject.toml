[project]
name = "papertown"
version = "0.1.0"
description = "Papertown backend: the world state, agent workers, skills, RAG library and MCP ports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "mcp>=1.2",
    "textual>=1.0",
    "teletty",
]

[tool.uv.sources]
teletty = { path = "../teletty", editable = true }

[project.scripts]
papertown = "papertown.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
